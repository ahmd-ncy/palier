<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Palier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#0e1012;--s1:#16191c;--s2:#1e2226;--b:#272c31;--t:#e7e9eb;--m:#8a929a;--a:#8fb3a3;--a2:rgba(143,179,163,.14);--d:#d98c84;--w:#d6b56f;--r:16px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh}
main{max-width:640px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:30px;font-weight:650;margin:2px 0 6px;letter-spacing:-.02em}
h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
h3{font-size:12px;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 8px}
p{margin:6px 0}
.card{background:var(--s1);border:1px solid var(--b);border-radius:var(--r);padding:14px;margin-bottom:12px}
.muted{color:var(--m)}.small{font-size:13px}.accent{color:var(--a)}
button{font:inherit;color:inherit;border:0;background:var(--s2);border-radius:12px;padding:12px 16px;cursor:pointer;touch-action:manipulation}
button:active{opacity:.75}
button.primary{background:var(--a);color:#0d1512;font-weight:600}
button.ghost{background:transparent;color:var(--a)}
button.danger{color:var(--d)}
button.block{width:100%;display:block}
button.icon{padding:6px 10px;background:transparent;color:var(--m)}
input,select{font:inherit;font-size:16px;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--m) 50%),linear-gradient(135deg,var(--m) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus{border-color:var(--a)}
label.lbl{display:block;font-size:13px;color:var(--m);margin:12px 0 6px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(14,16,18,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav#tabs button{flex:1;background:none;border-radius:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--m)}
nav#tabs button.on{color:var(--a)}
nav#tabs svg{width:23px;height:23px}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 50px;gap:8px;align-items:center;margin:7px 0}
.set-row input{text-align:center;padding:11px 4px}
.set-row.done input{background:var(--a2);border-color:transparent}
.chk{height:46px;padding:0;font-size:19px;color:var(--m)}
.set-row.done .chk{background:var(--a);color:#0d1512}
.hdr{font-size:12px;color:var(--m);margin:12px 0 0}.hdr span{text-align:center}
.idx{text-align:center;color:var(--m);font-size:14px}
#rest{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));background:#20262a;border:1px solid #2f383d;border-radius:18px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:8px;z-index:25;max-width:616px;margin:0 auto}
#rest.on{display:flex}
#rest button{padding:10px 12px;background:#2a3135}
.bar{height:4px;background:var(--b);border-radius:2px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--a);width:100%}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--s1);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 16px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--b);animation:up .22s ease-out}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--b);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);background:#242a2e;border:1px solid #333b40;padding:10px 16px;border-radius:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-size:15px;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;margin:8px 0 14px}
.seg button{flex:1;padding:8px 4px;background:none;border-radius:9px;font-size:14px;color:var(--m)}.seg button.on{background:#2a3035;color:var(--t)}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--b);cursor:pointer}.li:last-child{border-bottom:0}
.badge{font-size:12px;background:var(--a2);color:var(--a);padding:3px 9px;border-radius:99px;white-space:nowrap}
.big{font-size:32px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.dots{display:flex;gap:6px}.dot{flex:1;text-align:center;font-size:12px;color:var(--m)}.dot i{display:block;height:8px;border-radius:4px;background:var(--s2);margin-bottom:5px}.dot.on i{background:var(--a)}.dot.today{color:var(--t)}
.chart{display:block;margin-top:8px}.chart text{fill:var(--m);font-size:10px}.chart .grid{stroke:var(--b);stroke-width:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stats div{background:var(--s2);border-radius:12px;padding:10px}.stats b{display:block;font-size:17px}.stats span{font-size:12px;color:var(--m)}
.grid-ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{aspect-ratio:3/4;background:var(--s2);border-radius:12px;overflow:hidden;position:relative;cursor:pointer}.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:7px}
.compare{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--s2);margin-top:12px}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.compare .cl{position:absolute;top:0;bottom:0;width:2px;background:var(--a);left:50%}.compare .tag{position:absolute;top:8px;font-size:12px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:8px}
input[type=range]{padding:0;border:0;background:transparent;height:30px;-webkit-appearance:auto;appearance:auto;accent-color:var(--a)}
.empty{text-align:center;color:var(--m);padding:28px 10px}
.logo{width:34px;height:34px;border-radius:9px}
.sync{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--m)}.sync.ok{background:var(--a)}.sync.sync{background:var(--w)}.sync.error{background:var(--d)}
.pr{color:var(--w)}
</style>
</head>
<body>
<main id="view"></main>
<div id="rest"><div class="grow"><div class="muted small">Repos</div><div id="restT" class="big" style="font-size:26px">2:00</div><div class="bar"><i id="restBar"></i></div></div><button data-a="restadj" data-d="-15">−15</button><button data-a="restadj" data-d="15">+15</button><button data-a="reststop" aria-label="Arrêter">✕</button></div>
<nav id="tabs"></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
"use strict";
/* ---------- Utilitaires ---------- */
const CFG = window.PALIER_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad2 = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayStr = () => dstr(new Date());
const parseD = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
const fmtKg = n => String(Math.round(n * 100) / 100).replace('.', ',');
const fmtNum = v => Math.abs(v) >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10).replace('.', ',');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const fmtDate = (s, o = {weekday: 'short', day: 'numeric', month: 'short'}) => (s.length <= 10 ? parseD(s) : new Date(s)).toLocaleDateString('fr-FR', o);
const fmtSec = s => Math.floor(s / 60) + ':' + pad2(Math.max(0, s % 60));
const fmtDur = ms => { const m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? h + ' h ' + pad2(m % 60) : m + ' min'; };
const fmtClock = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600); return (h ? h + ':' + pad2(Math.floor(s / 60) % 60) : Math.floor(s / 60)) + ':' + pad2(s % 60); };
const e1rm = s => s.w <= 0 ? s.r : s.r <= 1 ? s.w : s.w * (1 + s.r / 30);
const wTxt = w => w > 0 ? fmtKg(w) + ' kg' : 'PDC';
const bestOf = sets => sets.reduce((m, s) => Math.max(m, e1rm(s)), 0);
const bestSet = sets => sets.reduce((b, s) => (!b || e1rm(s) > e1rm(b)) ? s : b, null);
const fmtSets = sets => sets.map(s => (s.w > 0 ? fmtKg(s.w) : 'PDC') + '×' + s.r).join(' · ');
const MUSCLES = ['Pecs', 'Dos', 'Épaules', 'Biceps', 'Triceps', 'Jambes', 'Mollets', 'Abdos', 'Autre'];
const POSES = ['Face', 'Profil', 'Dos'];
const DAY = 864e5;

/* ---------- Stockage local ---------- */
const LS = 'palier.v1', LS_ACTIVE = 'palier.active', LS_REST = 'palier.rest';
let S = (() => { try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.items) return s; } catch (e) {} return {items: {}, dirty: []}; })();
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('Stockage plein'); } };
function put(kind, id, data, ts) {
  S.items[id] = {id, kind, data, updated_at: ts || nowISO(), deleted: false};
  if (!ts) markDirty(id);
  save();
}
function del(id) { const it = S.items[id]; if (!it) return; it.deleted = true; it.updated_at = nowISO(); markDirty(id); save(); }
function markDirty(id) { if (!S.dirty.includes(id)) S.dirty.push(id); scheduleSync(); }
const all = kind => Object.values(S.items).filter(i => i.kind === kind && !i.deleted).map(i => ({...i.data, id: i.id}));
const get = id => { const i = S.items[id]; return i && !i.deleted ? {...i.data, id} : null; };
const settings = () => ({rest: 120, goal: 5, ...(get('settings') || {})});
const setSettings = patch => { const s = settings(); delete s.id; put('settings', 'settings', {...s, ...patch}); };
const templates = () => all('template').sort((a, b) => a.position - b.position);
const workouts = () => all('workout').sort((a, b) => b.date.localeCompare(a.date));
const exName = id => (get(id) || {}).name || 'Exercice supprimé';
const weights = () => all('weight').sort((a, b) => a.date.localeCompare(b.date));
const measures = () => all('measure').sort((a, b) => a.date.localeCompare(b.date));
const photos = () => all('photo').sort((a, b) => b.date.localeCompare(a.date));

/* ---------- Programme de base ---------- */
function seed() {
  if (S.seeded) return;
  const T = '2000-01-01T00:00:00.000Z';
  const EX = [
    ['tractions','Tractions','Dos'],['rowing-barre','Rowing barre','Dos'],['tirage-serre','Tirage vertical prise serrée','Dos'],['rowing-haltere','Rowing haltère unilatéral','Dos'],['face-pull','Face pull','Épaules'],['curl-incline','Curl incliné','Biceps'],
    ['dc','Développé couché','Pecs'],['di-halteres','Développé incliné haltères','Pecs'],['militaire','Développé militaire','Épaules'],['elev-lat','Élévations latérales','Épaules'],['ecarte-poulie','Écarté à la poulie','Pecs'],['ext-poulie','Extension triceps à la poulie','Triceps'],
    ['curl-ez','Curl barre EZ','Biceps'],['barre-front','Barre au front','Triceps'],['curl-marteau','Curl marteau','Biceps'],['dips','Dips','Triceps'],['curl-pupitre','Curl pupitre','Biceps'],['ext-corde','Extension triceps à la corde','Triceps'],
    ['tirage-large','Tirage vertical prise large','Dos'],['rowing-poulie','Rowing poulie basse','Dos'],['rowing-machine','Rowing machine (appui poitrine)','Dos'],['pullover','Pull-over à la poulie','Dos'],['oiseau','Oiseau (arrière d’épaule)','Épaules'],['curl-poulie','Curl à la poulie','Biceps'],
    ['di-barre','Développé incliné barre','Pecs'],['dc-halteres','Développé couché haltères','Pecs'],['dev-epaules-halteres','Développé épaules haltères','Épaules'],['elev-lat-poulie','Élévations latérales à la poulie','Épaules'],['pec-deck','Pec deck','Pecs'],['ext-nuque','Extension triceps nuque haltère','Triceps'],
    ['squat','Squat','Jambes'],['sdt-jt','Soulevé de terre jambes tendues','Jambes'],['presse','Presse à cuisses','Jambes'],['leg-curl','Leg curl','Jambes'],['leg-ext','Leg extension','Jambes'],['mollets','Mollets debout','Mollets'],
    ['crunch-poulie','Crunch à la poulie','Abdos'],['releve-jambes','Relevé de jambes suspendu','Abdos'],['hip-thrust','Hip thrust','Jambes'],['fentes','Fentes haltères','Jambes'],['shrug','Shrugs','Dos'],['sdt','Soulevé de terre','Dos']
  ];
  EX.forEach(([k, n, m]) => put('exercise', 'ex-' + k, {name: n, muscle: m}, T));
  const TPL = [
    ['pull-a','Pull A',[['tractions',3,'6-10'],['rowing-barre',3,'8-10'],['tirage-serre',3,'10-12'],['rowing-haltere',3,'10-12'],['face-pull',3,'12-15'],['curl-incline',2,'10-12']]],
    ['push-a','Push A',[['dc',3,'6-8'],['di-halteres',3,'8-10'],['militaire',3,'8-10'],['elev-lat',4,'12-15'],['ecarte-poulie',3,'12-15'],['ext-poulie',2,'10-12']]],
    ['bras','Bras',[['curl-ez',3,'8-10'],['barre-front',3,'8-10'],['curl-marteau',3,'10-12'],['dips',3,'8-12'],['curl-pupitre',3,'10-12'],['ext-corde',3,'12-15']]],
    ['pull-b','Pull B',[['tirage-large',3,'8-10'],['rowing-poulie',3,'8-12'],['rowing-machine',3,'10-12'],['pullover',3,'12-15'],['oiseau',3,'12-15'],['curl-poulie',2,'12-15']]],
    ['push-b','Push B',[['di-barre',3,'6-8'],['dc-halteres',3,'8-10'],['dev-epaules-halteres',3,'8-10'],['elev-lat-poulie',4,'12-15'],['pec-deck',3,'12-15'],['ext-nuque',2,'10-12']]],
    ['jambes','Jambes',[['squat',3,'6-8'],['sdt-jt',3,'8-10'],['presse',3,'10-12'],['leg-curl',3,'10-12'],['leg-ext',3,'12-15'],['mollets',4,'12-15']]]
  ];
  TPL.forEach(([k, n, items], i) => put('template', 'tpl-' + k, {name: n, position: i, items: items.map(([e, s, r]) => ({exId: 'ex-' + e, sets: s, reps: r}))}, T));
  S.seeded = true; save();
}

/* ---------- Calculs ---------- */
function nextTemplate() {
  const tpls = templates(); if (!tpls.length) return null;
  const last = workouts().find(w => w.templateId && tpls.some(t => t.id === w.templateId));
  if (!last) return tpls[0];
  return tpls[(tpls.findIndex(t => t.id === last.templateId) + 1) % tpls.length];
}
function lastPerf(exId) {
  for (const w of workouts()) { const e = w.entries.find(x => x.exId === exId && x.sets.length); if (e) return {date: w.date, sets: e.sets}; }
  return null;
}
function history(exId) {
  return workouts().slice().reverse().map(w => { const e = w.entries.find(x => x.exId === exId && x.sets.length); return e ? {id: w.id, date: w.date, sets: e.sets, best: bestOf(e.sets)} : null; }).filter(Boolean);
}
function weekStart(d = new Date()) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7); }
function avgBetween(list, from, to) { const v = list.filter(x => { const t = parseD(x.date).getTime(); return t >= from && t <= to; }); return v.length ? v.reduce((a, x) => a + x.kg, 0) / v.length : null; }
function weightStats() {
  const ws = weights(); const t = parseD(todayStr()).getTime();
  const cur = avgBetween(ws, t - 6 * DAY, t), prev = avgBetween(ws, t - 13 * DAY, t - 7 * DAY);
  const avgSeries = ws.map(w => { const x = parseD(w.date).getTime(); return {x, y: avgBetween(ws, x - 6 * DAY, x)}; });
  return {ws, cur, prev, delta: cur != null && prev != null ? cur - prev : null, avgSeries, first: ws[0]};
}
function workoutVolume(w) { return w.entries.reduce((a, e) => a + e.sets.reduce((b, s) => b + s.w * s.r, 0), 0); }

/* ---------- Graphique SVG ---------- */
function chart(series) {
  const pts = series.flatMap(s => s.pts);
  if (Math.max(0, ...series.map(x => x.pts.length)) < 2) return '<div="empty small">Pas encore assez de données pour tracer une courbe.</div>';
  const W = 340, H = 180, L = 38, R = 10, T = 10, B = 24;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)); if (x1 === x0) { x0 -= DAY; x1 += DAY; }
  let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y)); const pd = Math.max((y1 - y0) * .15, .5); y0 -= pd; y1 += pd;
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = sy(v).toFixed(1); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${+y + 3}" text-anchor="end">${fmtNum(v)}</text>`; }
  const dl = t => new Date(t).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
  g += `<text x="${L}" y="${H - 6}">${dl(x0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${dl(x1)}</text>`;
  for (const s of series) {
    const p = s.pts.slice().sort((a, b) => a.x - b.x), c = s.color || 'var(--a)';
    if (s.line && p.length > 1) g += `<path d="${p.map((q, i) => (i ? 'L' : 'M') + sx(q.x).toFixed(1) + ' ' + sy(q.y).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots) g += p.map(q => `<circle cx="${sx(q.x).toFixed(1)}" cy="${sy(q.y).toFixed(1)}" r="${s.r || 3}" fill="${c}" opacity="${s.op || 1}"/>`).join('');
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}

/* ---------- UI de base ---------- */
const state = {tab: 'home', prog: 'exos', edit: null};
let active = (() => { try { return JSON.parse(localStorage.getItem(LS_ACTIVE)); } catch (e) { return null; } })();
const saveActive = () => active ? localStorage.setItem(LS_ACTIVE, JSON.stringify(active)) : localStorage.removeItem(LS_ACTIVE);
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheetBg').classList.add('on'); $('#sheet').scrollTop = 0; hydratePhotos($('#sheet')); }
function closeSheet() { $('#sheetBg').classList.remove('on'); $('#sheet').innerHTML = ''; }
let confirmFn = null;
function confirmSheet(text, ok, fn, danger = true) { confirmFn = fn; openSheet(`<h2 style="margin-bottom:8px">${text}</h2><button class="block ${danger ? 'danger' : 'primary'}" data-a="confirmOk" style="margin-top:16px">${ok}</button><button class="block ghost" data-a="close" style="margin-top:6px">Annuler</button>`); }

const ICONS = {
  home: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  session: '<path d="M3 10v4M21 10v4M6 7v10M18 7v10M6 12h12"/>',

let actx = null;

const idb = {

  open() { return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open('palier', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async op(mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const q = fn(d.transaction('photos', mode).objectStore('photos')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  get(k) { return this.op('readonly', s => s.get(k)); }, set(k, v) { return this.op('readwrite', s => s.put(v, k)); }, del(k) { return this.op('readwrite', s => s.delete(k)); }
};
const urlCache = {};
async function photoURL(id) {
  if (urlCache[id]) return urlCache[id];

  if (!blob) { const p = get(id); if (p && p.path && sb && user) { const {data} = await sb.storage.from('photos').download(p.path); if (data) { blob = data; idb.set(id, data).catch(() => {}); } } }

}

  if (!img) img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });

  return new Promise(r => c.toBlob(r, 'image/jpeg', .82));
}

function importFile(e) {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    const d = JSON.parse(txt); if (!d.items) throw new Error('format');
    let n = 0;
    Object.values(d.items).forEach(it => { const l = S.items[it.id]; if (!l || new Date(it.updated_at) > new Date(l.updated_at)) { S.items[it.id] = it; if (!S.dirty.includes(it.id)) S.dirty.push(it.id); n++; } });
    save(); scheduleSync(); render(); toast(`${n} éléments importés`);
  }).catch(() => toast('Fichier invalide'));
}

/* ---------- Supabase ---------- */
let sb = null, user = null, syncState = 'off', syncing = false, syncTimer = null, resync = false;
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
function updateSyncDot() { document.querySelectorAll('.sync').forEach(el => el.className = 'sync ' + syncState); }
async function initSupabase() {
  if (!CFG.supabaseUrl || !CFG.supabaseKey) return;
  try {
    const m = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sb = m.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth: {persistSession: true, autoRefreshToken: true, storageKey: 'palier.auth'}});
    const {data} = await sb.auth.getSession(); user = data.session ? data.session.user : null;
    sb.auth.onAuthStateChange((_e, s) => { const was = user && user.id; user = s ? s.user : null; if (user && user.id !== was) { sync(); safeRender(); } if (!user && was) safeRender(); });
    safeRender(); if (user) sync();
  } catch (e) { console.warn('Supabase', e); }
}
function safeRender() { const a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT') && $('#view').contains(a)) return; render(); }
async function sync() {
  if (!sb || !user) return;
  if (syncing) { resync = true; return; }
  if (!navigator.onLine) { syncState = 'offline'; updateSyncDot(); return; }
  syncing = true; syncState = 'sync'; updateSyncDot();
  try {
    const pushed = S.dirty.map(id => S.items[id]).filter(Boolean).map(i => ({user_id: user.id, id: i.id, kind: i.kind, data: i.data, deleted: i.deleted, updated_at: i.updated_at}));
    for (let k = 0; k < pushed.length; k += 500) { const {error} = await sb.from('items').upsert(pushed.slice(k, k + 500), {onConflict: 'user_id,id'}); if (error) throw error; }
    S.dirty = S.dirty.filter(id => { const p = pushed.find(x => x.id === id); return !p || !S.items[id] || S.items[id].updated_at !== p.updated_at; });
    save();
    let from = 0, changed = false;
    for (;;) {
      const {data, error} = await sb.from('items').select('id,kind,data,deleted,updated_at').order('id').range(from, from + 999);
      if (error) throw error;
      for (const r of data) { const l = S.items[r.id]; if (S.dirty.includes(r.id)) continue; if (!l || new Date(r.updated_at) > new Date(l.updated_at)) { S.items[r.id] = r; changed = true; } }
      if (data.length < 1000) break; from += 1000;
    }
    save();
    for (const p of all('photo').filter(p => !p.uploaded)) {
      const blob = await idb.get(p.id).catch(() => null); if (!blob) continue;
      const path = `${user.id}/${p.id}.jpg`;
      const {error} = await sb.storage.from('photos').upload(path, blob, {contentType: 'image/jpeg', upsert: true});
      if (error) throw error;
      const {id, ...d} = p; put('photo', id, {...d, uploaded: true, path}); changed = true;
    }
    if (S.dirty.length) { const rows = S.dirty.map(id => S.items[id]).filter(Boolean).map(i => ({user_id: user.id, id: i.id, kind: i.kind, data: i.data, deleted: i.deleted, updated_at: i.updated_at})); const {error} = await sb.from('items').upsert(rows, {onConflict: 'user_id,id'}); if (!error) { S.dirty = S.dirty.filter(id => !rows.some(r => r.id === id && S.items[id].updated_at === r.updated_at)); } }
    S.lastSync = nowISO(); save(); syncState = 'ok';
    if (changed) safeRender();
  } catch (e) { console.warn('Sync', e); syncState = 'error'; }
  syncing = false; updateSyncDot();
  if (resync) { resync = false; sync(); }
}

document.addEventListener('click', e => {
  if (e.target.id === 'sheetBg') return closeSheet();
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = A[t.dataset.a]; if (fn) { e.preventDefault(); fn(t.dataset, t, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && active) { const s = active.entries[t.dataset.ei].sets[t.dataset.si]; s[t.dataset.f] = t.value; saveActive(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tplName' && state.edit) { const tp = get(state.edit); tp.name = t.value.trim() || 'Séance'; saveTpl(tp); }
  if (t.dataset.tf && state.edit) { const tp = get(state.edit), it = tp.items[+t.dataset.i]; it[t.dataset.tf] = t.dataset.tf === 'sets' ? +t.value : t.value.trim(); saveTpl(tp); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'wIn') A.addweight(); if (e.key === 'Enter' && e.target.id === 'mIn') A.addmeasure(); });
window.addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); sync(); } });

/* ---------- Démarrage ---------- */
seed();
render(); tick();
initSupabase();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
